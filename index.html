<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hockey Rush</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#0a1426"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
html,body{margin:0;height:100%;background:#0a1426;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,Arial,sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;top:6px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:#0009;border-radius:10px;padding:4px 12px;font-weight:800;font-size:18px;pointer-events:none}
.fx{color:#ffb020}.ow{color:#8fd0ff}#clk{min-width:52px;text-align:center;color:#fff}
#btns{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:14px;width:190px;height:170px}
.b{position:absolute;width:74px;height:74px;border-radius:50%;border:3px solid #fff8;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;background:#0008}
.b.on{transform:scale(.92);background:#fff4}
#b1{right:0;bottom:0;background:#c0282899}#b2{right:84px;bottom:0;background:#2860c099}#b3{right:42px;bottom:86px;background:#c0902099}
#msg{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:44px;font-weight:900;text-shadow:0 3px 0 #000,0 0 18px #000;pointer-events:none;text-align:center;white-space:nowrap}
#over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#000a;gap:14px}
#over button,#start button{font-size:22px;font-weight:800;padding:12px 28px;border-radius:12px;border:0;background:#ffb020;color:#201000}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#0a1426e8;gap:10px;text-align:center}
#start h1{margin:0;font-size:40px}#start p{margin:0;opacity:.85;font-size:15px}
#rot{display:none;position:fixed;inset:0;background:#0a1426;align-items:center;justify-content:center;font-size:22px;z-index:9;text-align:center}
@media (orientation:portrait){#rot{display:flex}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><span class="fx">FOXES</span><span class="fx" id="s0">0</span><span id="clk">3:00</span><span class="ow" id="s1">0</span><span class="ow">OWLS</span></div>
<div id="btns"><div class="b" id="b1">SHOOT</div><div class="b" id="b2">PASS</div><div class="b" id="b3">DEKE</div></div>
<div id="msg"></div><div id="doff" style="display:none;position:fixed;top:44px;left:50%;transform:translateX(-50%);background:#ffd23a;color:#201000;font-weight:900;padding:3px 10px;border-radius:8px;font-size:14px;pointer-events:none">✋ DELAYED OFFSIDE</div>
<div id="start"><h1><span class="fx">BLAZE FOXES</span> vs <span class="ow">FROST OWLS</span></h1><p>Left stick to skate. Buttons change with offence and defence:<br>Shoot / Poke check · Pass / Switch · Deke / Hit</p><button id="go">PLAY</button></div>
<div id="over"><h1 id="res"></h1><button id="again">PLAY AGAIN</button></div>
<div id="rot">Turn your phone sideways 🏒</div>
<script src="atlas.js"></script><script src="game.js"></script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')</script>
</body></html>
